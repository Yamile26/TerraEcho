name: TerraEcho release checks
on:
  pull_request:
  push:
    branches: [data-pipeline, main, develop, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-science.lock.txt
      - run: python -m unittest discover -s tests -p 'test_science.py' -v
      - run: python tests/test_pipeline.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:web
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: node --import tsx web/scripts/export-reference.mts
      - uses: actions/upload-artifact@v4
        with:
          name: reference-audio-${{ github.sha }}
          path: out/reference/*.wav
          retention-days: 7
